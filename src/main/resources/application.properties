spring.application.name=feed-app

spring.datasource.url=jdbc:mysql://localhost:3306/feed_app?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:feed-app-2nd-week-default-secret-key-for-jwt-authentication}
jwt.expiration=3600000
